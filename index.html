
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parcial 1 - Programación 3</title>
    <link rel="stylesheet" href="css/styles.css">
    <script defer src="index.js"></script>
</head>
<body>
    <header>
        <h2>Parcial 1 - Division 131</h2>
    </header>

    <main>
        <h1 id="titulo-users">Users</h1>
        <hr>

        <div class="controles">

            <div class="opciones">

                <div class="filtros">
                    <label>
                        <input type="radio" name="estado" checked>
                        Active
                    </label>

                    <label>
                        <input type="radio" name="estado">
                        Inactive
                    </label>

                    <label>
                        <input type="radio" name="estado">
                        All
                    </label>
                </div>

                <div class="botones">
                    <button type="button">CREATE</button>
                    <button type="button">DEACTIVATE</button>
                    <button type="button">RESET PASSWORD</button>
                </div>

            </div>

            <div class="buscador">
                <input type="text" id="busqueda" placeholder="Search Users">
            </div>

        </div>

        <div id="users-container"></div>

    </main>

    <footer>
        <p>Valentin Alvarez</p>
    </footer>

</body>
</html>
